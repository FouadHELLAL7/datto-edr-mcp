services:
  # Gateway mode. Instance URL and API token arrive per request on the
  # X-Datto-EDR-URL and X-Datto-EDR-API-Token headers. Do not set
  # DATTO_EDR_URL, DATTO_EDR_API_TOKEN, or env_file here — that would put
  # static vendor credentials in the container. The project .env is used only
  # for Compose interpolation of CONDUIT_S2S_SECRET. For AUTH_MODE=env, pass
  # DATTO_EDR_URL and DATTO_EDR_API_TOKEN on that process instead (see the README).
  datto-edr-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: datto-edr-mcp:latest
    container_name: datto-edr-mcp-server
    restart: unless-stopped
    environment:
      # Logging configuration
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      # Optional hardening: restrict instance hosts and hide write tools
      - DATTO_EDR_ALLOWED_HOSTS=${DATTO_EDR_ALLOWED_HOSTS:-}
      - DATTO_EDR_READ_ONLY=${DATTO_EDR_READ_ONLY:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Mount logs directory for persistence
      - datto-edr-mcp-logs:/app/logs

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits for production use
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Development service
  datto-edr-mcp-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: datto-edr-mcp:dev
    container_name: datto-edr-mcp-dev
    working_dir: /app
    restart: "no"
    command: npm run dev
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - DATTO_EDR_URL=${DATTO_EDR_URL}
      - DATTO_EDR_API_TOKEN=${DATTO_EDR_API_TOKEN}
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - datto-edr-mcp-dev-logs:/app/logs
    stdin_open: true
    tty: true

volumes:
  datto-edr-mcp-logs:
    driver: local
  datto-edr-mcp-dev-logs:
    driver: local
